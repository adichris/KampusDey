{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="max-w-md mx-auto card bg-base-100 border border-base-300">
  <div class="card-body">
    <h1 class="text-xl font-bold">{% blocktranslate with t=listing.title %}Is “{{ t }}” still available?{% endblocktranslate %}</h1>
    <div class="grid grid-cols-2 gap-2 mt-2">
      <form method="post" action="{% url 'listings:one_tap' confirm_token %}">{% csrf_token %}<button class="btn btn-primary w-full tap">{% translate "Still available" %}</button></form>
      <form method="post" action="{% url 'listings:one_tap' taken_token %}">{% csrf_token %}<button class="btn btn-neutral w-full tap">{% translate "Taken" %}</button></form>
    </div>
  </div>
</div>
{% endblock %}
