{% extends "base.html" %}
{% load i18n %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card bg-base-100 border border-base-300">
  <div class="card-body text-center">
    <h1 class="text-xl font-bold">{{ listing.title }}</h1>
    <form method="post">{% csrf_token %}
      {% if action == "confirm" %}<button class="btn btn-primary w-full tap">{% translate "Yes, it's still available" %}</button>
      {% else %}<button class="btn btn-neutral w-full tap">{% translate "Mark as taken" %}</button>{% endif %}
    </form>
  </div>
</div>
{% endblock %}
