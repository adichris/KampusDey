{% if listing.is_visible %}{% if listing.section == "jobs" and details %}
<script type="application/ld+json" nonce="{{ request.csp_nonce }}">
{
  "@context": "https://schema.org/",
  "@type": "JobPosting",
  "title": "{{ listing.title|escapejs }}",
  "description": "{{ listing.description|default:listing.title|linebreaksbr|escapejs }}",
  "datePosted": "{{ listing.published_at|date:'c' }}",
  {% if details.deadline %}"validThrough": "{{ details.deadline|date:'Y-m-d' }}T23:59:00",{% endif %}
  "employmentType": "{% if details.job_type == 'full_time' %}FULL_TIME{% elif details.job_type == 'internship' or details.job_type == 'attachment' %}INTERN{% elif details.job_type == 'gig' %}CONTRACTOR{% else %}PART_TIME{% endif %}",
  "hiringOrganization": {"@type": "Organization", "name": "{{ listing.owner.public_name|escapejs }}"},
  "jobLocation": {"@type": "Place", "address": {"@type": "PostalAddress", "addressLocality": "{{ listing.town.name|escapejs }}", "addressRegion": "{{ listing.town.region.name|escapejs }}", "addressCountry": "GH"}},
  "directApply": true,
  "url": "{{ SITE_URL }}{{ listing.get_absolute_url }}"
}
</script>
{% elif listing.section == "events" and details %}
<script type="application/ld+json" nonce="{{ request.csp_nonce }}">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "name": "{{ listing.title|escapejs }}",
  "startDate": "{{ details.starts_at|date:'c' }}",
  {% if details.ends_at %}"endDate": "{{ details.ends_at|date:'c' }}",{% endif %}
  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
  "eventStatus": "https://schema.org/EventScheduled",
  "location": {"@type": "Place", "name": "{{ details.venue|escapejs }}", "address": {"@type": "PostalAddress", "addressLocality": "{{ listing.town.name|escapejs }}", "addressCountry": "GH"}},
  {% if photos %}"image": ["{{ photos.0.card.url|absolute }}"],{% endif %}
  "description": "{{ listing.description|default:listing.title|escapejs }}",
  {% if details.organiser %}"organizer": {"@type": "Organization", "name": "{{ details.organiser|escapejs }}"},{% endif %}
  "url": "{{ SITE_URL }}{{ listing.get_absolute_url }}"
}
</script>
{% endif %}{% endif %}
