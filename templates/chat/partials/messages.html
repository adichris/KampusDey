{% load i18n %}
{% for message in chat_messages %}
<c-chat-bubble :message="message" mine="{% if message.sender_id == me.pk %}1{% endif %}" other_alias="{{ other_alias }}" />
{% empty %}
<p class="text-center text-sm opacity-60 py-8">{% translate "Say hello and ask about the listing." %}</p>
{% endfor %}
{% if error %}<div class="alert alert-error text-sm my-2" role="alert">{{ error }}</div>{% endif %}
