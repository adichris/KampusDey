{% load i18n %}<div style="font-family:Arial,sans-serif;max-width:560px">
<h2>{% blocktranslate with p=place %}New near {{ p }} this week{% endblocktranslate %}</h2>
<ul>{% for item in items %}<li><a href="{{ SITE_URL }}{{ item.get_absolute_url }}">{{ item.title }}</a> — {{ item.card_info }}</li>{% endfor %}</ul>
<p style="font-size:12px;color:#666"><a href="{{ SITE_URL }}/notifications/settings/">{% translate "Turn off the weekly digest" %}</a></p>
</div>
