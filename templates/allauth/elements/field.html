{% load allauth %}
<div class="fieldset mb-2">
  {% if attrs.type == "checkbox" or attrs.type == "radio" %}
  <label class="label cursor-pointer justify-start gap-3 text-base-content whitespace-normal">
    <input class="{% if attrs.type == 'checkbox' %}checkbox checkbox-primary{% else %}radio radio-primary{% endif %}" {% if attrs.required %}required{% endif %} {% if attrs.checked %}checked{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %} type="{{ attrs.type }}">
    <span>{% slot label %}{% endslot %}</span>
  </label>
  {% elif attrs.type == "textarea" %}
  <label class="fieldset-legend text-base-content" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
  <textarea class="textarea textarea-bordered w-full" {% if attrs.required %}required{% endif %} {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %}>{% slot value %}{% endslot %}</textarea>
  {% else %}
  <label class="fieldset-legend text-base-content" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
  <input class="input input-bordered w-full {% if attrs.errors %}input-error{% endif %}" {% if attrs.required %}required{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.readonly %}readonly{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %} {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %} {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %} type="{{ attrs.type }}">
  {% endif %}
  {% if slots.help_text %}<p class="label text-xs whitespace-normal">{% slot help_text %}{% endslot %}</p>{% endif %}
  {% if attrs.errors %}<div class="text-error text-xs">{{ attrs.errors }}</div>{% endif %}
</div>
