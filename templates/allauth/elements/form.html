{% load allauth %}
<form method="{{ attrs.method }}" class="space-y-2" {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
  {% slot body %}{% endslot %}
  {% if turnstile_site_key %}<div class="cf-turnstile my-2" data-sitekey="{{ turnstile_site_key }}"></div>{% endif %}
  <div class="flex flex-col gap-2 pt-2">{% slot actions %}{% endslot %}</div>
</form>
