{% load i18n %}
<c-vars icon="package" title="" text="" action_url="" action_label="" />
<div class="flex flex-col items-center text-center gap-3 py-10 px-4 rounded-box bg-base-100 border border-dashed border-base-300">
  <div class="rounded-full bg-base-200 p-4 text-primary">{% icon icon "size-8" %}</div>
  <h3 class="font-bold text-lg">{{ title }}</h3>
  {% if text %}<p class="text-sm opacity-75 max-w-sm">{{ text }}</p>{% endif %}
  {{ slot }}
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary">{% icon "plus" %} {% if action_label %}{{ action_label }}{% else %}{% translate "Post the first one" %}{% endif %}</a>{% endif %}
</div>
