{% load i18n %}
<c-vars listing photos max />
<div data-upload-url="{% url 'listings:photo_upload' listing.pk %}" data-target="photo-list" data-uploading="{% translate 'Uploading…' %}"
     class="border-2 border-dashed border-base-300 rounded-box p-4 bg-base-100 text-center">
  <label class="btn btn-primary tap">
    {% icon "camera" %} {% translate "Add photos" %}
    <input type="file" accept="image/*" multiple class="hidden" data-photo-input>
  </label>
  <p class="text-xs opacity-70 mt-2">{% blocktranslate %}Drag photos here or tap to choose. Up to {{ max }} photos. Location data (EXIF) is removed.{% endblocktranslate %}</p>
  <p class="text-xs mt-1" data-upload-status aria-live="polite"></p>
</div>
<div id="photo-list" class="mt-3">{% include "listings/partials/photo_list.html" %}</div>
